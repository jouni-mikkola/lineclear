name: nightly

# Tests hold under parallel load: each night every shard of the full check runs as 4 copies at once on one runner,
# the way agents run several checks on one machine. A test with a fixed port, a shared path or a timed sleep fails here.
# Untimed like the other GitHub jobs, 5 minutes a job at most (test/light-checks.test.ts keeps it so).
on:
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@localhost
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@localhost

jobs:
  parallel:
    name: 4 copies of shard ${{ matrix.shard }}/4
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'server/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # Each copy gets its own clone and HOME, as a second agent's check would, so installs and builds do not collide.
      # Any copy that fails fails the job.
      - run: |
          pids=()
          for copy in 1 2 3 4; do
            mkdir -p "$RUNNER_TEMP/copy-$copy"
            git worktree add --detach -q "$RUNNER_TEMP/tree-$copy" HEAD
            (cd "$RUNNER_TEMP/tree-$copy" && bun install --frozen-lockfile > "$RUNNER_TEMP/copy-$copy.log" 2>&1 && HOME="$RUNNER_TEMP/copy-$copy" bun scripts/check.ts --full --no-cache --untimed --shard=${{ matrix.shard }}/4 >> "$RUNNER_TEMP/copy-$copy.log" 2>&1) &
            pids+=($!)
          done
          status=0
          for pid in "${pids[@]}"; do wait "$pid" || status=1; done
          for copy in 1 2 3 4; do echo "::group::copy $copy"; tail -n 40 "$RUNNER_TEMP/copy-$copy.log"; echo "::endgroup::"; done
          exit $status
