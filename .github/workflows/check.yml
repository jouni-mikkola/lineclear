name: check

# Checks are light and run here, never on a machine of the owner's: no browser, no coverage run, 5 minutes a job at most
# (test/light-checks.test.ts keeps it so). Changed tests while working, the full light check once at merge.
# A pull request runs only the tests of what it changed (scripts/check.ts --changed, the quick tier the lane uses too).
# The merge queue runs the full check once, in 4 jobs that each take every 4th step of it (--shard).
# A push to main runs it too, so the release loop finds a green "check" on the commit it promotes. Require the job "check" in the branch rules: it is green when the
# jobs of the event passed. Lineclear's setting check.where = github waits for it.
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  workflow_dispatch:

# Tests that commit into a scratch repo need a git identity, which a runner has none of.
env:
  GIT_AUTHOR_NAME: ci
  GIT_AUTHOR_EMAIL: ci@localhost
  GIT_COMMITTER_NAME: ci
  GIT_COMMITTER_EMAIL: ci@localhost

concurrency:
  group: check-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  changed:
    name: changed tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # the check compares the branch with a local main
      - run: git fetch --no-tags origin main:main
        if: github.base_ref == 'main'
      # Tests commit in fresh repos, which need an identity and a default branch the runner lacks
      - run: |
          git config --global user.name ci
          git config --global user.email ci@localhost
          git config --global init.defaultBranch main
      - uses: oven-sh/setup-bun@v2
      # The Bun install cache, keyed by both lockfiles
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'server/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      # --untimed: a shared runner's speed decides a test's time, not the code
      - run: bun scripts/check.ts --changed --untimed

  full:
    name: full check (${{ matrix.shard }}/4)
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'server/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun scripts/check.ts --full --no-cache --untimed --shard=${{ matrix.shard }}/4

  check:
    name: check
    if: always()
    needs: [changed, full]
    runs-on: ubuntu-latest
    steps:
      - run: test "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = false
