name: heavy

# The whole-repo gates no pull request or merge waits for. No browser suite and no coverage run, ever (test/light-checks.test.ts).
# (The model evals spend tokens and run on the owner's machines.)
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: heavy
  cancel-in-progress: true

jobs:
  heavy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: git fetch --no-tags origin main:main
        if: github.ref_name != 'main'
      - uses: oven-sh/setup-bun@v2
      - uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: bun-${{ runner.os }}-${{ hashFiles('bun.lock', 'server/bun.lock') }}
          restore-keys: bun-${{ runner.os }}-
      - run: bun install --frozen-lockfile
      - run: bun run gates:full
