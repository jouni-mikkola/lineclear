name: install

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  install:
    # A fresh Ubuntu virtual machine with systemd.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # The test tags are local, so the installer clones the checked-out workspace, not GitHub.
      LINECLEAR_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
          ref: ${{ github.sha }}

      # pi needs Node.js 22.19 or newer, and its installer cannot ask for it without a terminal.
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Start a systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          until [ -S "/run/user/$uid/bus" ]; do sleep 1; done
          echo "XDG_RUNTIME_DIR=/run/user/$uid" >> "$GITHUB_ENV"
          echo "DBUS_SESSION_BUS_ADDRESS=unix:path=/run/user/$uid/bus" >> "$GITHUB_ENV"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          echo "$HOME/.bun/bin" >> "$GITHUB_PATH"

      # The release wants the pi and the packages pinned in pi/kit.json, not the newest pi the installer would take.
      - name: Install the pinned agent kit
        run: |
          npm install -g "@earendil-works/pi-coding-agent@$(node -p 'require("./pi/kit.json").pi')"
          node -e 'for (const [n, v] of Object.entries(require("./pi/kit.json").packages)) console.log(`npm:${n}@${v}`)' |
            while read -r spec; do pi install "$spec"; done
          pi --version
          # the update's smoke check starts a coordinator chat, and pi will not start an agent without a model set
          node -e 'const f = process.env.HOME + "/.pi/agent/settings.json", s = require(f); s.defaultProvider = "claude-bridge"; s.defaultModel = "claude-sonnet-5-5"; require("fs").writeFileSync(f, JSON.stringify(s, null, 2))'

      # A user installs a release, so the test tags the commit as one, in the checked-out copy only.
      - name: Install the commit as a release
        run: |
          git tag v0.0.1 "$(git rev-parse HEAD)"
          LINECLEAR_REF=v0.0.1 sh install.sh
          test "$(readlink ~/.lineclear/builds/current)" = "$HOME/.lineclear/builds/0.0.1"

      - name: A newer release waits as a candidate
        run: |
          git tag v0.0.2 "$(git rev-parse HEAD)"
          LINECLEAR_REF=v0.0.2 sh < install.sh
          test -f ~/.lineclear/builds/0.0.2/.release
          test "$(readlink ~/.lineclear/builds/current)" = "$HOME/.lineclear/builds/0.0.1"

      - name: Doctor passes
        run: |
          lineclear doctor > "$RUNNER_TEMP/doctor" || true
          cat "$RUNNER_TEMP/doctor"
          if grep '^FAILED' "$RUNNER_TEMP/doctor"; then exit 1; fi
          grep -q '^ok ' "$RUNNER_TEMP/doctor"

      - name: The user sees one name
        run: bun scripts/one-name.ts

      - name: A second install changes no file
        run: |
          snap() {
            find ~/.lineclear ~/.config/systemd/user ~/.local/bin/lineclear ~/.pi/agent/extensions/lineclear.ts \
              -type f -print0 | sort -z | xargs -0 sha256sum
            find ~/.lineclear ~/.config/systemd/user ~/.local/bin/lineclear ~/.pi/agent/extensions/lineclear.ts \
              -type l -printf '%p %l\n' | sort
          }
          snap > "$RUNNER_TEMP/before"
          LINECLEAR_REF=v0.0.2 sh < install.sh
          snap > "$RUNNER_TEMP/after"
          diff "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"

      - name: Uninstall leaves none of Lineclear's files
        run: |
          lineclear uninstall --all
          for p in ~/.lineclear ~/.config/lineclear ~/.local/bin/lineclear \
            ~/.pi/agent/extensions/lineclear.ts ~/.config/systemd/user/lineclear.service; do
            if [ -e "$p" ] || [ -L "$p" ]; then echo "left behind: $p"; exit 1; fi
          done
          if systemctl --user is-active --quiet lineclear.service; then echo "service still running"; exit 1; fi

  machine:
    # Settings adds a machine over SSH: here the runner adds itself, as localhost, the way it adds any other machine.
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      LINECLEAR_REPO: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: oven-sh/setup-bun@v2

      - name: Start a systemd user session
        run: |
          sudo loginctl enable-linger "$USER"
          uid=$(id -u)
          until [ -S "/run/user/$uid/bus" ]; do sleep 1; done

      # The release wants the pi and the packages pinned in pi/kit.json, not the newest pi the installer would take.
      - name: Install the pinned agent kit
        run: |
          npm install -g "@earendil-works/pi-coding-agent@$(node -p 'require("./pi/kit.json").pi')"
          node -e 'for (const [n, v] of Object.entries(require("./pi/kit.json").packages)) console.log(`npm:${n}@${v}`)' |
            while read -r spec; do pi install "$spec"; done
          pi --version

      - name: Let SSH reach this machine with a key, and find Node.js 22 there
        run: |
          sudo apt-get install -y -q openssh-server
          sudo systemctl start ssh
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          ssh-keygen -q -t ed25519 -N "" -f ~/.ssh/id_ed25519
          cat ~/.ssh/id_ed25519.pub >> ~/.ssh/authorized_keys
          chmod 600 ~/.ssh/authorized_keys
          ssh-keyscan -H localhost >> ~/.ssh/known_hosts
          # an SSH session gets the system PATH, not this job's
          for b in node npm npx pi; do sudo ln -sf "$(command -v $b)" /usr/local/bin/$b; done
          ssh -o BatchMode=yes localhost 'node --version'

      - name: lineclear machine add installs it over SSH and its doctor passes
        run: |
          git tag v0.0.1
          # a checkout's bin/lineclear refuses the stable folders, so it gets folders of its own
          export LINECLEAR_CONFIG=$RUNNER_TEMP/config LINECLEAR_HOME=$RUNNER_TEMP/home LINECLEAR_PORT=7499
          LINECLEAR_REF=v0.0.1 bin/lineclear machine add "$USER@localhost"
          bin/lineclear machine list
          bin/lineclear machine list | grep -q "^$USER@localhost  *ready"
          test -f ~/.lineclear/builds/0.0.1/.release
