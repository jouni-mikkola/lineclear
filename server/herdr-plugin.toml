# The id stays herdr-projects, the plugin Lineclear replaces: herdr refuses an update whose id changed, so someone on
# herdr-projects lands on Lineclear with `herdr plugin update` (docs/upgrading.md).
id = "herdr-projects"
name = "Lineclear"
version = "2.0.0"
min_herdr_version = "0.9.0"
description = "Run many coding agents across machines from a phone, tablet or desktop: places, coordinator chats, one agent per task"
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/need-bun.sh", "install", "--frozen-lockfile"]
platforms = ["linux", "macos"]

[[build]]
command = ["sh", "scripts/need-bun.sh", "run", "build"]
platforms = ["linux", "macos"]

# One-shot per herdr start: brings Lineclear up if it is not already answering, or swaps an older version for this one.
[[startup]]
command = ["sh", "scripts/need-bun.sh", "scripts/plugin.ts", "start"]
platforms = ["linux", "macos"]

# herdr-projects' key (prefix+a by default) named this action: it keeps working after the update.
[[actions]]
id = "open"
title = "Open Lineclear"
command = ["sh", "scripts/need-bun.sh", "scripts/plugin.ts", "open"]
platforms = ["linux", "macos"]

[[actions]]
id = "start"
title = "Start Lineclear"
contexts = ["workspace"]
command = ["sh", "scripts/need-bun.sh", "scripts/plugin.ts", "start"]
platforms = ["linux", "macos"]

[[actions]]
id = "stop"
title = "Stop Lineclear"
contexts = ["workspace"]
command = ["sh", "scripts/need-bun.sh", "scripts/plugin.ts", "stop"]
platforms = ["linux", "macos"]

[[actions]]
id = "status"
title = "Lineclear status"
contexts = ["workspace"]
command = ["sh", "scripts/need-bun.sh", "scripts/plugin.ts", "status"]
platforms = ["linux", "macos"]

[[actions]]
id = "share"
title = "Share Lineclear on my tailnet"
contexts = ["workspace"]
command = ["sh", "scripts/need-bun.sh", "scripts/plugin.ts", "share"]
platforms = ["linux", "macos"]

[[panes]]
id = "link"
title = "Lineclear"
command = ["sh", "scripts/link.sh"]
platforms = ["linux", "macos"]
